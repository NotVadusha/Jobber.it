[project]
name = "jobber-cron"
version = "0.1.0"
description = "Scheduled jobs: the gather chain and the dead-posting prune"
requires-python = ">=3.12"
# Everything else arrives through jobber — the crons drive its pipeline.
dependencies = ["jobber", "python-dotenv>=1.0"]

# No [project.scripts]: every step is its own runnable module, so the Dockerfile
# and the docs use `python -m jobber_cron.gather` / `python -m jobber_cron.prune`.

# Not on an index: jobber is the sibling app. Editable so a backend edit is live
# in this venv without a re-sync.
[tool.uv.sources]
jobber = { path = "../backend", editable = true }

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobber_cron"]

[tool.pytest.ini_options]
testpaths = ["tests"]
