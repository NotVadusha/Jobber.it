[project]
name = "jobber-mcp"
version = "0.1.0"
description = "MCP server over the indexed corpus — search and fetch, for a model instead of a browser"
requires-python = ">=3.12"
# Same shape as jobber-cron: everything but the protocol arrives through jobber.
dependencies = ["jobber", "mcp>=1.2", "python-dotenv>=1.0", "uvicorn[standard]>=0.52.4"]

# No [project.scripts]: one runnable module, so the Dockerfile and the docs use
# `python -m jobber_mcp`.

# Not on an index: jobber is the sibling app. Editable so a backend edit is live
# in this venv without a re-sync.
[tool.uv.sources]
jobber = { path = "../backend", editable = true }

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobber_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
