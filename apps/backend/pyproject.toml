[project]
name = "jobber"
version = "0.1.0"
description = "Job search RAG pipeline — ingestion, normalization, index and search API"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.69",
    "apify-client>=3.1,<4",
    "fastapi>=0.141.1",
    "httpx>=0.27",
    "openai>=1.60",
    "pinecone>=9.1",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2",
    "python-dotenv>=1.0",
    "selectolax>=0.3.21",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
jobber = "jobber.__main__:main"

# SQLAlchemy and Alembic never serve a query: the models exist to generate
# migrations, and every runtime path is raw psycopg (jobber/db). They live in
# their own group because the API image installs it — `alembic upgrade head`
# is that service's Railway pre-deploy step, so the schema moves with the code
# that needs it instead of waiting on someone's workstation.
[dependency-groups]
migrate = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]
dev = [
    "pytest>=8",
    "import-linter>=2.14",
    {include-group = "migrate"},
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobber"]

[tool.pytest.ini_options]
testpaths = ["tests"]
