[project]
name = "jobber"
version = "0.1.0"
description = "Job search RAG pipeline — ingestion, normalization, index and search API"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.69",
    "apify-client>=3.1,<4",
    "fastapi>=0.141.1",
    "httpx>=0.27",
    "openai>=1.60",
    "pinecone>=9.1",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2",
    "python-dotenv>=1.0",
    "selectolax>=0.3.21",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
jobber = "jobber.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobber"]

[tool.pytest.ini_options]
testpaths = ["tests"]
