# Alembic owns the schema. Two things are deliberately NOT here:
#
#   sqlalchemy.url  — the database comes from DATABASE_URL through jobber.config
#                     (env.py), so migrating a different environment is an env
#                     var, never an edit to a checked-in file.
#   the models      — jobber/db/migrations/schema.py, diffed by --autogenerate.
#
# Run from apps/backend:  uv run alembic upgrade head
[alembic]
script_location = jobber/db/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
